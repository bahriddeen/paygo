<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qarz Daftari</title>
    <script>
      // Apply theme + language before first paint to avoid a flash.
      try {
        var th = localStorage.getItem('qarz.theme')
        if (th === 'dark' || (!th && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
        var lg = localStorage.getItem('qarz.language')
        if (lg) document.documentElement.lang = lg
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
